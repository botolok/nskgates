<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Категории продукции</title>

  <style>
    :root{
      --bg:#f6f6f6;
      --card:#ffffff;
      --text:#1c1c1c;
      --muted:#6b6b6b;
      --line:#e7e7e7;
      --accent:#b01c1c;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Inter, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .section{
      padding:56px 16px 90px;
      max-width:1100px;
      margin:0 auto;
    }

    /* HEADER */

    .title{
      font-size:34px;
      line-height:1.1;
      font-weight:600;
      letter-spacing:-0.03em;
      margin-bottom:10px;
    }

    .subtitle{
      font-size:15px;
      color:var(--muted);
      max-width:360px;
      line-height:1.5;
      margin-bottom:28px;
    }

    /* GRID */

    .grid{
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    /* CARD */

    .card{
      background:var(--card);
      border:1px solid var(--line);
      overflow:hidden;
      cursor:pointer;
      transition:all .25s ease;
    }

    .card.active{
      border-color:var(--accent);
    }

    .card:active{
      transform:scale(0.99);
    }

    /* IMAGE */

    .imgWrap{
      position:relative;
      overflow:hidden;
    }

    .img{
      width:100%;
      height:240px;
      object-fit:cover;
      display:block;
      transition:transform .4s ease;
    }

    .card.active .img{
      transform:scale(1.03);
    }

    /* CTA overlay */

    .ctaArrow{
      position:absolute;
      right:16px;
      bottom:16px;

      display:flex;
      align-items:center;
      gap:8px;

      padding:10px 12px;

      font-size:13px;
      font-weight:500;

      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(6px);

      border:1px solid rgba(255,255,255,0.4);
    }

    /* CONTENT */

    .content{
      padding:18px 18px 20px;
    }

    .name{
      font-size:22px;
      font-weight:600;
      margin-bottom:10px;
      letter-spacing:-0.02em;
    }

    .desc{
      font-size:14px;
      color:var(--muted);
      line-height:1.6;
      margin-bottom:14px;
    }

    /* PREVIEW */

    .preview{
      display:none;
      flex-direction:column;
      gap:10px;

      border-top:1px solid #eee;
      padding-top:14px;

      animation:fade .25s ease;
    }

    .card.active .preview{
      display:flex;
    }

    .item{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .miniImg{
      width:64px;
      height:64px;
      object-fit:cover;
      flex-shrink:0;
    }

    .itemTitle{
      font-size:14px;
      line-height:1.3;
    }

    .more{
      margin-top:6px;
      font-size:14px;
      font-weight:600;
      color:var(--accent);
      text-decoration:none;
    }

    @keyframes fade{
      from{opacity:0;transform:translateY(10px);}
      to{opacity:1;transform:translateY(0);}
    }

    /* DESKTOP */

    @media(min-width:900px){
      .grid{
        flex-direction:row;
      }

      .card{
        flex:1;
      }

      .img{
        height:280px;
      }
    }

  </style>
</head>

<body>

<section class="section">

  <h1 class="title">Всё для надёжной<br>воротной системы</h1>
  <p class="subtitle">
    Комплекты, автоматика и фурнитура для частных и коммерческих объектов.
  </p>

  <div id="grid" class="grid"></div>

</section>

<script>
const data = [
  {
    title: "Комплекты откатных ворот",
    desc: "Современные решения для частных домов и коммерческих объектов.",
    img: "images/gates.jpg",
    items: [
      { title: "CLASSIC до 4 м", img: "images/m1.jpg" },
      { title: "INDUSTRIAL до 6 м", img: "images/m2.jpg" },
      { title: "С калиткой", img: "images/m3.jpg" }
    ]
  },
  {
    title: "Автоматика",
    desc: "Плавная и комфортная работа каждый день.",
    img: "images/auto.jpg",
    items: [
      { title: "Привод BASIC", img: "images/a1.jpg" },
      { title: "Привод PRO", img: "images/a2.jpg" }
    ]
  },
  {
    title: "Фурнитура",
    desc: "Надёжность системы начинается с деталей.",
    img: "images/furn.jpg",
    items: [
      { title: "Ролики", img: "images/f1.jpg" },
      { title: "Направляющие", img: "images/f2.jpg" }
    ]
  }
];

const grid = document.getElementById("grid");

let active = 0;

function render(){
  grid.innerHTML = "";

  data.forEach((c, i)=>{
    const el = document.createElement("div");
    el.className = "card" + (i===active ? " active" : "");

    el.innerHTML = `
      <div class="imgWrap">
        <img class="img" src="${c.img}" loading="lazy">
        <div class="ctaArrow">Смотреть →</div>
      </div>

      <div class="content">
        <div class="name">${c.title}</div>
        <div class="desc">${c.desc}</div>

        <div class="preview">
          ${c.items.map(it=>`
            <div class="item">
              <img class="miniImg" src="${it.img}" loading="lazy">
              <div class="itemTitle">${it.title}</div>
            </div>
          `).join("")}

          <a class="more" href="#">Подробнее о категории →</a>
        </div>
      </div>
    `;

    el.addEventListener("click", ()=>{
      active = i;
      render();
    });

    grid.appendChild(el);
  });
}

render();
</script>

</body>
</html>
